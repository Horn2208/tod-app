name: TodApp
options:
  bundleIdPrefix: com.lennetschierhorn
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
# Pinned to an exact release, with Package.resolved committed next to the
# project: a backend client is not something to float.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.2
  # Spotify's own iOS SDK: App Remote opens the Spotify app, starts a song
  # there and hands back to TodApp, which can then move it to the section.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
targets:
  TodApp:
    type: application
    platform: iOS
    sources:
      - path: TodApp
    # Pulls in Config/Secrets.xcconfig when it exists -- the Supabase address
    # and key, which stay out of git.
    configFiles:
      Debug: Config/TodApp.xcconfig
      Release: Config/TodApp.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SpotifyiOS
        product: SpotifyiOS
    # Sign in with Apple is how an account is made; the App ID needs the same
    # capability on developer.apple.com.
    entitlements:
      path: TodApp/TodApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: TodApp/Info.plist
      properties:
        UILaunchScreen: {}
        # The app is written in German throughout, so it says so. Without this
        # the bundle claims English, `Locale.current` follows the device, and
        # anything the system formats -- a relative timestamp under a comment,
        # a cancel button in a dialog -- comes back in another language beside
        # hand-written German copy.
        CFBundleLocalizations:
          - de
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
        # Point at the build settings instead of repeating the numbers: the
        # plist wins at runtime, so a literal here goes stale the first time
        # MARKETING_VERSION is bumped and nobody notices.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Public by design: PKCE puts this in every authorize URL, so there is
        # nothing to hide here. The client secret this used to sit next to is
        # gone -- that is the whole point of this app's sign-in flow.
        SpotifyClientID: 4c30dc0c418b42dea36251087825c547
        # App Remote asks whether the Spotify app is installed, and Spotify
        # hands back to TodApp through this scheme -- at todapp://auth/spotify,
        # the redirect already registered for the app on Spotify's dashboard.
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleURLName: com.lennetschierhorn.TodApp.spotify
            CFBundleURLSchemes:
              - todapp
        # Shown the first time someone connects Apple Music in the profile.
        # Without it iOS refuses the permission request outright.
        # Filled in at build time from Config/Secrets.xcconfig; this file only
        # names the setting. Without the secrets file both stay empty and the
        # app runs on its in-memory data (`SupabaseConfig`).
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSAppleMusicUsageDescription: "TodApp spielt die Songs deiner Gruppe über Apple Music – ganze Songs mit Abo, sonst die Vorschau."
        # Only HTTPS, which is exempt from export documentation. Without this
        # App Store Connect asks about encryption for every uploaded build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lennetschierhorn.TodApp
        # The team the app is signed with on a real iPhone. Set in Xcode alone,
        # it is gone after the next `xcodegen generate`.
        DEVELOPMENT_TEAM: B892A3M49U
        # What Xcode set when the app first went onto an iPhone; written here
        # so the next `xcodegen generate` keeps it.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        MARKETING_VERSION: "1.0"
        # Raised for every build uploaded to TestFlight: App Store Connect
        # takes each build number once per version.
        CURRENT_PROJECT_VERSION: "13"
        # The icon in TodApp/Assets.xcassets, drawn by tools/make-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. Built for iPad as well, with portrait alone, the upload
        # is refused: an iPad app must take every orientation. On an iPad it
        # still runs, in the iPhone's shape.
        TARGETED_DEVICE_FAMILY: "1"
  TodAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TodAppTests
    dependencies:
      - target: TodApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TodApp:
    build:
      targets:
        TodApp: all
        TodAppTests: [test]
    test:
      targets:
        - TodAppTests
    run:
      config: Debug
