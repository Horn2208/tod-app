name: TodApp
options:
  bundleIdPrefix: com.lennetschierhorn
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
targets:
  TodApp:
    type: application
    platform: iOS
    sources:
      - path: TodApp
    configFiles:
      Debug: Secrets.xcconfig
      # Release intentionally does NOT point at Secrets.xcconfig: an Archive
      # build must never bake the live Spotify client secret into a
      # distributable IPA. Pointing this at the example file gives Release
      # builds empty credentials, so search fails loudly with the
      # "missing Spotify credentials" message instead of shipping a secret.
      Release: Secrets.example.xcconfig
    info:
      path: TodApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
        # Point at the build settings instead of repeating the numbers: the
        # plist wins at runtime, so a literal here goes stale the first time
        # MARKETING_VERSION is bumped and nobody notices.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        SpotifyClientSecret: $(SPOTIFY_CLIENT_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lennetschierhorn.TodApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TodAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TodAppTests
    dependencies:
      - target: TodApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TodApp:
    build:
      targets:
        TodApp: all
        TodAppTests: [test]
    test:
      targets:
        - TodAppTests
    run:
      config: Debug
