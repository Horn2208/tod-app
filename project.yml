name: TodApp
options:
  bundleIdPrefix: com.lennetschierhorn
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
targets:
  TodApp:
    type: application
    platform: iOS
    sources:
      - path: TodApp
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: TodApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        SpotifyClientSecret: $(SPOTIFY_CLIENT_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lennetschierhorn.TodApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TodAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TodAppTests
    dependencies:
      - target: TodApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TodApp:
    build:
      targets:
        TodApp: all
        TodAppTests: [test]
    test:
      targets:
        - TodAppTests
    run:
      config: Debug
